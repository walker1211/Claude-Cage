permissions:
  contents: read
concurrency:
  group: cage-ci-macos26-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: '2d7d6e8481eb3e8dbe855fbb4fc0a15c72c6291c'
      release: false
      artifact_name: cage-macos-26-arm64-test
