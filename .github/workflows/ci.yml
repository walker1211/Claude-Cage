name: Supplement missing macOS validation
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run only the selected missing validation
        type: choice
        options: [keychain, package]
        default: keychain
        required: true
      runner:
        description: Use Intel only as a separate Keychain fallback
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
        required: true
permissions:
  contents: read
concurrency:
  group: cage-macos-gaps-${{ github.ref }}-${{ inputs.scope }}-${{ inputs.runner }}
  cancel-in-progress: false
jobs:
  supplement:
    name: ${{ inputs.scope }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.scope == 'keychain' && 10 || 45 }}
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: '2d7d6e8481eb3e8dbe855fbb4fc0a15c72c6291c'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: '2d7d6e8481eb3e8dbe855fbb4fc0a15c72c6291c'
          persist-credentials: false
      - name: Verify source and isolated hosted macOS environment
        env:
          VALIDATION_SCOPE: ${{ inputs.scope }}
          VALIDATION_RUNNER: ${{ inputs.runner }}
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          case "$VALIDATION_RUNNER" in
            macos-15) [[ "$(uname -m)" == arm64 ]] ;;
            macos-15-intel) [[ "$(uname -m)" == x86_64 && "$VALIDATION_SCOPE" == keychain ]] ;;
            *) exit 2 ;;
          esac
          case "$VALIDATION_SCOPE" in keychain|package) ;; *) exit 2 ;; esac
          printf 'Verified source %s; scope=%s; runner=%s\n' "$SOURCE_SHA" "$VALIDATION_SCOPE" "$VALIDATION_RUNNER"
      - name: Original automatic-login Keychain lifecycle
        if: inputs.scope == 'keychain'
        timeout-minutes: 8
        run: |
          log="$RUNNER_TEMP/cage-keychain-test.log"
          trap 'rm -f "$log"' EXIT
          set +e
          bash scripts/test-account-device.sh >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" == 0 ]]; then
            grep '^PASS: ' "$log"
          else
            printf 'Keychain validation failed: exit_code=%s\n' "$status"
            python3 - "$log" <<'PY' || true
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for code in sorted(set(re.findall(r"快捷登录凭据（(-?\d+)）", text))):
              print("keychain_osstatus=" + code)
          for line in sorted(set(re.findall(r"AccountDeviceTests failed at line (\d+)", text))):
              print("assertion_line=" + line)
          print("compiler_error=" + str(bool(re.search(r"\berror:", text))).lower())
          PY
            exit "$status"
          fi
      - uses: actions/setup-go@v7.0.0
        if: inputs.scope == 'package'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        if: inputs.scope == 'package'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and verify an uninstalled development App on macOS 15
        id: package
        if: inputs.scope == 'package'
        env:
          CAGE_SIGNING_IDENTITY: '-'
          DIAGNOSTIC_CERT_BASE64: ''
        run: |
          log="$RUNNER_TEMP/cage-package.log"
          trap 'rm -f "$log"' EXIT
          stage=dependencies
          validate_package() {
            brew install glib gettext pcre2 || return
            brew upgrade glib gettext pcre2 || return
            stage=build
            bash scripts/build-app.sh || return
            stage=bundle-verification
            codesign --verify --deep --strict _output/Cage.app || return
            _output/Cage.app/Contents/Resources/cage --help || return
            _output/Cage.app/Contents/Resources/mihomo -v || return
            [[ "$(lipo -archs _output/Cage.app/Contents/MacOS/Cage)" == arm64 ]] || return
            for executable in Contents/MacOS/Cage Contents/Resources/cage Contents/Resources/mihomo Contents/Resources/CageUpdateInstaller; do
              test -x "_output/Cage.app/$executable" || return
            done
          }
          set +e
          validate_package >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" != 0 ]]; then
            printf 'Package validation failed: stage=%s exit_code=%s\n' "$stage" "$status"
            python3 - "$log" <<'PY' || true
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for category, pattern in {
              "compiler_error": r"\berror:",
              "dependency_lock_mismatch": r"(?i)(differs from the reviewed SSHFS dependency lock|(recipe|checksum|sha256|version).{0,100}(mismatch|expected|does not match))",
              "network_timeout": r"(?i)(timed out|timeout)",
              "signature_failure": r"(?i)(invalid signature|code object is not signed|a sealed resource is missing)",
          }.items():
              print(category + "=" + str(bool(re.search(pattern, text))).lower())
          PY
            diagnostics="$RUNNER_TEMP/cage-encrypted-diagnostics"
            mkdir -p "$diagnostics"
            certificate="$RUNNER_TEMP/cage-diagnostic-public.pem"
            printf '%s' "$DIAGNOSTIC_CERT_BASE64" | openssl base64 -d -A > "$certificate"
            if openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$log" -out "$diagnostics/build-log.cms" "$certificate"; then
              echo 'Encrypted diagnostic log prepared; no plaintext log is published.'
            else
              rm -f "$diagnostics/build-log.cms"
              echo 'Diagnostic encryption failed.'
            fi
            rm -f "$certificate"
            exit "$status"
          fi
          echo 'PASS: macOS 15 ARM64 development App build, deep signature and executable checks'
      - name: Retain only the encrypted failure diagnostic
        if: failure() && inputs.scope == 'package' && steps.package.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: encrypted-macos-package-diagnostic
          path: ${{ runner.temp }}/cage-encrypted-diagnostics/build-log.cms
          if-no-files-found: error
          retention-days: 1
      - name: Record the exact limited validation scope
        if: success()
        env:
          VALIDATION_SCOPE: ${{ inputs.scope }}
          VALIDATION_RUNNER: ${{ inputs.runner }}
        run: |
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'Passed: `%s` on `%s`.\n\n' "$VALIDATION_SCOPE" "$VALIDATION_RUNNER"
            echo 'Supplemental validation only. Existing successful Go, race, UI, Linux and Windows checks were not rerun.'
            echo 'No release signing, Touch ID, VM launch, application installation or full original macOS CI claim.'
          } >> "$GITHUB_STEP_SUMMARY"
